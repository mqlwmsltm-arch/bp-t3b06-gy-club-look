        /* BRUTALIST-AVANTGARDE / KR-NEON-VOID (재사용 디자인 시스템)          */
        /* ------------------------------------------------------------------ */
        :root {
            --bg: #0a0a0a;
            --bg-alt: #111;
            --bg-card: #161616;
            --text: #f0f0f0;
            --text-dim: #999;
            --accent: #00f7ff;
            --accent-alt: #ff00a0;
            --border: #2a2a2a;
            --border-accent: #00f7ff;
            --font-body: 'Inter', 'Noto Sans KR', sans-serif;
            --font-heading: 'Space Grotesk', 'Inter', sans-serif;
            --font-mono: 'JetBrains Mono', 'Fira Code', monospace;
            --spacing-xs: 4px;
            --spacing-sm: 8px;
            --spacing-md: 16px;
            --spacing-lg: 32px;
            --spacing-xl: 64px;
            --max-width: 1200px;
            --header-h: 72px;
            --radius: 0px;
            --shadow: 0 4px 0 0 #000;
            --transition: 0.2s ease;
        }

        *,
        *::before,
        *::after {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        html {
            scroll-behavior: smooth;
            font-size: 16px;
        }

        body {
            background-color: var(--bg);
            color: var(--text);
            font-family: var(--font-body);
            line-height: 1.7;
            -webkit-font-smoothing: antialiased;
            min-height: 100vh;
        }

        img {
            max-width: 100%;
            height: auto;
            display: block;
        }
        a {
            color: var(--accent);
            text-decoration: none;
            transition: color var(--transition);
        }
        a:hover {
            color: var(--accent-alt);
        }

        /* ---- 헤더 & 네비게이션 (재사용) ---- */
        .site-header {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            height: var(--header-h);
            background: var(--bg);
            border-bottom: 2px solid var(--border);
            z-index: 1000;
            display: flex;
            align-items: center;
        }

        .header-inner {
            width: 100%;
            max-width: var(--max-width);
            margin: 0 auto;
            padding: 0 var(--spacing-lg);
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .logo {
            font-family: var(--font-heading);
            font-size: 1.5rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 2px;
            color: var(--text);
        }
        .logo a {
            color: var(--text);
        }
        .logo a:hover {
            color: var(--accent);
        }

        .nav-links {
            display: flex;
            gap: var(--spacing-lg);
            list-style: none;
        }
        .nav-links li a {
            font-size: 0.9rem;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 1.5px;
            color: var(--text-dim);
            padding: var(--spacing-xs) 0;
            border-bottom: 2px solid transparent;
            transition: color var(--transition), border-color var(--transition);
        }
        .nav-links li a:hover,
        .nav-links li a.active {
            color: var(--accent);
            border-bottom-color: var(--accent);
        }

        /* 햄버거 메뉴 */
        .hamburger-menu {
            display: none;
            flex-direction: column;
            cursor: pointer;
            background: none;
            border: none;
            padding: var(--spacing-sm);
            gap: 5px;
        }
        .hamburger-menu span {
            display: block;
            width: 28px;
            height: 3px;
            background: var(--text);
            transition: all 0.3s;
            border-radius: 0;
        }
        .hamburger-menu.active span:nth-child(1) {
            transform: rotate(45deg) translate(6px, 6px);
        }
        .hamburger-menu.active span:nth-child(2) {
            opacity: 0;
        }
        .hamburger-menu.active span:nth-child(3) {
            transform: rotate(-45deg) translate(6px, -6px);
        }

        @media (max-width: 768px) {
            .hamburger-menu {
                display: flex;
            }
            .nav-links {
                display: none;
                position: absolute;
                top: var(--header-h);
                left: 0;
                right: 0;
                background: var(--bg);
                flex-direction: column;
                padding: var(--spacing-lg);
                border-bottom: 2px solid var(--border);
                gap: var(--spacing-md);
            }
            .nav-links.open {
                display: flex;
            }
            .header-inner {
                padding: 0 var(--spacing-md);
            }
        }

        /* ---- 메인 컨텐츠 영역 ---- */

            padding-bottom: var(--spacing-xl);
            max-width: var(--max-width);
            margin: 0 auto;
            padding-left: var(--spacing-lg);
            padding-right: var(--spacing-lg);
        }

            margin-bottom: var(--spacing-xl);

            padding-bottom: var(--spacing-md);

            align-items: center;

            letter-spacing: -0.5px;

            color: var(--accent);
        }

        .article-subtitle {

            color: var(--text-dim);
            font-weight: 400;
            margin-bottom: var(--spacing-lg);
            border-left: 4px solid var(--accent-alt);
            padding-left: var(--spacing-md);
        }

        .article-body h2 {
            font-family: var(--font-heading);
            font-size: 1.5rem;
            font-weight: 700;
            margin-top: var(--spacing-xl);
            margin-bottom: var(--spacing-md);
            color: var(--accent);
            letter-spacing: 0.5px;
        }

        .article-body h3 {
            font-family: var(--font-heading);
            font-size: 1.2rem;
            font-weight: 600;
            margin-top: var(--spacing-lg);
            margin-bottom: var(--spacing-sm);
            color: var(--text);
        }

        .article-body p {
            margin-bottom: var(--spacing-md);
            color: var(--text);
            font-size: 1rem;
        }

        .article-body ul,
        .article-body ol {
            margin-left: var(--spacing-lg);
            margin-bottom: var(--spacing-md);
        }

        .article-body li {
            margin-bottom: var(--spacing-xs);
        }

        .article-body blockquote {
            border-left: 6px solid var(--accent-alt);
            padding: var(--spacing-md) var(--spacing-lg);
            margin: var(--spacing-lg) 0;
            background: rgba(255, 0, 160, 0.05);
            font-style: italic;
            color: var(--text-dim);
        }

        .data-stat-box {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
            gap: var(--spacing-md);
            margin: var(--spacing-lg) 0;
            border: 2px solid var(--border-accent);
            padding: var(--spacing-lg);
            background: var(--bg);
        }

        .stat-item {
            text-align: center;
            padding: var(--spacing-md);
            border: 1px solid var(--border);
        }

        .stat-number {
            font-family: var(--font-heading);
            font-size: 2.6rem;
            font-weight: 800;
            color: var(--accent);
            line-height: 1;
        }

        .stat-label {
            font-size: 0.85rem;
            text-transform: uppercase;
            letter-spacing: 1.5px;
            color: var(--text-dim);
            margin-top: var(--spacing-xs);
        }

        .faq-section {
            margin-top: var(--spacing-xl);
            border-top: 2px solid var(--border);
            padding-top: var(--spacing-lg);
        }

        .faq-section h2 {
            font-family: var(--font-heading);
            font-size: 1.5rem;
            color: var(--accent);
            margin-bottom: var(--spacing-lg);
        }

        .faq-item {
            border-bottom: 1px solid var(--border);
            padding: var(--spacing-md) 0;
        }

        .faq-question {
            font-weight: 700;
            font-size: 1.05rem;
            color: var(--text);
            cursor: pointer;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: var(--spacing-sm) 0;
        }

        .faq-question::after {
            content: '+';
            font-size: 1.6rem;
            color: var(--accent);
            transition: transform 0.3s;
        }

        .faq-item.active .faq-question::after {
            content: '−';
        }

        .faq-answer {
            max-height: 0;
            overflow: hidden;
            transition: max-height 0.4s ease, padding 0.3s ease;
            color: var(--text-dim);
            line-height: 1.6;
        }

        .faq-item.active .faq-answer {
            max-height: 300px;
            padding-bottom: var(--spacing-md);
        }

        /* ---- 푸터 (재사용) ---- */
